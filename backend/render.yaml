services:
  - type: web
    name: expense-tracker-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        fromDatabase:
          name: expense-tracker
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://expense-tracker-web.vercel.app
      - key: LOG_LEVEL
        value: info

databases:
  - name: expense-tracker
    databaseName: expense_tracker
    user: expense_tracker_user
